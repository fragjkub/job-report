<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4F7; --surface:#FFFFFF; --ink:#16202B; --muted:#657386;
    --line:#DCE2EA; --hover:#F7F9FC; --head:#FAFBFC; --field:#EEF1F5;
    --accent:#2F5BEA; --accent-tint:#EEF3FE; --ok:#1E9E5A; --bad:#D6403A; --danger:#B42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:24px 16px 48px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .stat{padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:12px}

  .toolbar{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
  .label{color:var(--muted);font-size:12px;width:56px;flex:none}

  .pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
  .pill b{font-weight:600;font-variant-numeric:tabular-nums}
  .pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
  .pill.small{font-size:12px;padding:3px 9px}

  .search{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-width:220px;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:#254ED2}
  .btn.danger{color:var(--danger);border-color:#F3C4C0}
  .btn.danger:hover:not(:disabled){background:#FEF3F2}
  .btn.small{padding:4px 9px;font-size:12px}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:500;background:var(--head);position:sticky;top:0}
  tbody tr:hover td{background:var(--hover)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  td.empty{text-align:center;color:var(--muted);padding:32px}
  .row-actions{display:inline-flex;align-items:center;gap:6px}

  input.cell-text{border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;font:inherit;color:var(--ink);width:110px}
  input.cell-text:hover{border-color:var(--line)}
  input.cell-text:focus{background:#fff;border-color:var(--accent);outline:none}

  .bar{display:inline-block;width:110px;height:6px;background:#E8ECF1;border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar.done i{background:var(--ok)}
  .pct{display:inline-block;min-width:44px;margin-left:8px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

  .issue-btn{background:none;border:0;padding:2px 6px;font:inherit;color:var(--ink);cursor:pointer;border-radius:4px;text-decoration:underline dotted var(--muted);text-underline-offset:3px;font-variant-numeric:tabular-nums}
  .issue-btn:hover{background:var(--hover)}
  .issue-btn.bad{color:var(--bad);font-weight:600}

  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:500;font-size:13px}
  .ts{font-variant-numeric:tabular-nums;color:var(--ink)}
  .ts.none{color:var(--muted)}

  select.inline{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;background:#fff;cursor:pointer}

  /* Compact link cell + Notion-style floating popover */
  a.open{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(47,91,234,.35);text-underline-offset:3px;font-weight:500}
  a.open:hover{text-decoration-color:var(--accent)}
  .addlink{background:none;border:0;padding:2px 4px;font:inherit;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;border-radius:4px}
  .addlink:hover{color:var(--ink);background:var(--field)}

  .popover{
    position:fixed;z-index:1000;background:#fff;border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.14),0 1px 3px rgba(16,24,40,.06);
    padding:4px 6px;
  }
  .popover[hidden]{display:none}

  .lp-preview{display:flex;align-items:center;gap:4px;min-height:28px}
  .lp-url{
    display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;
    color:var(--muted);text-decoration:none;font-size:13px;max-width:290px;
  }
  .lp-url:hover{background:var(--hover);color:var(--ink)}
  .lp-url-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
  .lp-icon-btn{
    display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border:0;background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;flex:none;
  }
  .lp-icon-btn:hover{background:var(--field);color:var(--ink)}
  .lp-icon-btn.copied{color:var(--ok)}
  .lp-edit-btn{
    border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;
    padding:3px 8px;border-radius:5px;cursor:pointer;
  }
  .lp-edit-btn:hover{background:var(--field)}

  .lp-edit{display:flex;align-items:center;gap:6px;padding:2px}
  .lp-input{
    width:270px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font:inherit;font-size:13px;color:var(--ink);background:#fff;
  }
  .lp-input:focus{border-color:var(--accent);outline:none}

  /* Excel row menu popover */
  .xm{min-width:220px;padding:6px;display:flex;flex-direction:column;gap:4px}
  .xm-head{font-size:12px;color:var(--muted);padding:3px 6px 6px;border-bottom:1px solid var(--line);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xm-btn{
    display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;
    padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;
  }
  .xm-btn:hover:not(:disabled){background:var(--field)}
  .xm-btn:disabled{opacity:.45;cursor:default}

  dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(580px,92vw);color:var(--ink);box-shadow:0 20px 50px rgba(16,24,40,.2)}
  dialog.xl{width:min(1280px,96vw)}
  dialog::backdrop{background:rgba(16,24,40,.35)}
  .dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dlg-head h2{font-size:16px;font-weight:600;margin:0}
  .dlg-body{padding:12px 18px;display:flex;flex-direction:column;gap:10px;max-height:65vh;overflow:auto}
  dialog.xl .dlg-body{max-height:78vh;overflow:hidden}
  .dlg-foot{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .muted{color:var(--muted)}

  .note{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
  .note.done{opacity:.6}
  .note textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;resize:vertical;min-height:52px}
  .note-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
  .note-meta .at{margin-right:auto}

  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .field input,.field select,.field-input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;color:var(--ink);background:#fff}
  .field-input{flex:1;min-width:220px}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

  #reportText{width:100%;min-height:340px;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.55 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color:var(--ink);resize:vertical;background:#FBFCFD}

  /* Matrix modal + cluster bar + v tick column */
  .mx-cluster-bar{display:flex;flex-direction:column;gap:6px}
  .mx-left{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mx-log{display:flex;flex-wrap:wrap;gap:6px;max-height:76px;overflow:auto}
  .mx-log-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:6px;padding:2px 6px 2px 8px;background:var(--head);color:var(--ink);
  }
  .mx-log-del{
    border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    padding:0 2px;border-radius:3px;
  }
  .mx-log-del:hover{color:var(--danger);background:#FEF3F2}

  .mx-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .mx-banner{
    background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:8px;
    padding:6px 10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .mx-wrap{
    flex:1;min-height:240px;max-height:56vh;overflow:auto;
    border:1px solid var(--line);border-radius:8px;background:#fff;
  }
  table.mx{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  table.mx th,table.mx td{
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;
  }
  table.mx thead th{
    position:sticky;top:0;z-index:3;background:var(--head);color:var(--muted);font-weight:600;
  }
  table.mx tbody tr.mx-clickable{cursor:pointer;user-select:none}
  table.mx tbody tr.mx-clickable:hover td.mx-meta,
  table.mx tbody tr.mx-clickable:hover td.mx-v{background:#EEF3FE}
  table.mx tbody tr.mx-clickable:hover td.mx-cell{box-shadow:inset 0 1px 0 rgba(47,91,234,.45), inset 0 -1px 0 rgba(47,91,234,.45)}

  table.mx tbody tr.mx-done td.mx-meta{background:#F0FAF4}
  table.mx tbody tr.mx-done td.mx-v{background:#F0FAF4}
  table.mx tbody tr.mx-done td.mx-cell{opacity:.72}

  table.mx .sticky-0{position:sticky;left:0;z-index:2;width:62px;min-width:62px;max-width:62px;background:#fff;font-weight:600}
  table.mx .sticky-1{
    position:sticky;left:62px;z-index:2;width:112px;min-width:112px;max-width:112px;
    background:#fff;text-align:left;overflow:hidden;text-overflow:ellipsis;
    box-shadow:2px 0 0 rgba(220,226,234,.9);
  }
  table.mx .sticky-v{
    position:sticky;right:0;z-index:2;width:36px;min-width:36px;max-width:36px;
    background:#fff;border-left:1px solid var(--line);border-right:0;
    box-shadow:-2px 0 0 rgba(220,226,234,.65);
    font-size:14px;font-weight:500;color:var(--ink);
  }
  table.mx thead .sticky-0,
  table.mx thead .sticky-1,
  table.mx thead .sticky-v{z-index:5;background:var(--head);font-size:12px;color:var(--muted);font-weight:600}

  table.mx td.mx-cell{min-width:28px;height:25px;padding:2px 4px;font-weight:600;font-size:11.5px}
  table.mx td.mx-cell.mx-present{background:#DCE8FF;color:#1D4ED8}
  table.mx td.mx-cell.mx-sym{box-shadow:inset 0 0 0 1px rgba(180,35,24,.35)}
  table.mx.mx-generic th,table.mx.mx-generic td{text-align:left;padding:6px 10px;max-width:420px;overflow:hidden;text-overflow:ellipsis}

  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="count"></div>
    </div>
    <div class="row">
      <input id="q" class="search" type="search" placeholder="Search batch, task, job, QC…">
      <button type="button" class="btn primary" data-action="add-job">+ Add job</button>
      <button id="report" class="btn" type="button">Report</button>
      <button id="backup" class="btn" type="button">Backup</button>
      <button id="restore" class="btn" type="button">Restore</button>
      <input id="restoreFile" type="file" accept="application/json,.json" hidden>
      <input id="attachFile" type="file" accept=".xlsx" hidden>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <section class="card">
    <div class="toolbar">
      <div class="row"><span class="label">Stage</span><div class="row" id="statePills"></div></div>
      <div class="row"><span class="label">QC</span><div class="row" id="qcPills"></div></div>
      <div class="row"><span class="label">Columns</span><div class="row" id="colPills"></div></div>
    </div>
    <div class="tablewrap" id="tableWrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>

</div>

<!-- Notes dialog (open issues) -->
<dialog id="notesDlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div>
      <h2 id="dlgTitle"></h2>
      <div class="sub" id="dlgSub"></div>
    </div>
    <button type="button" class="btn small" data-close>Close</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot">
    <span class="sub">Unresolved notes are counted as open issues.</span>
    <button type="button" class="btn primary" id="addNote">+ Add note</button>
  </div>
</dialog>

<!-- Unified Excel Matrix & Track Ticking modal -->
<dialog id="matrixDlg" class="xl" aria-labelledby="mxTitle">
  <div class="dlg-head">
    <div>
      <h2 id="mxTitle">Matrix</h2>
      <div class="sub" id="mxSub"></div>
    </div>
    <button type="button" class="btn small" data-close>Close</button>
  </div>
  <div class="dlg-body">
    <div id="mxBanner" class="mx-banner" hidden></div>

    <!-- Cluster quick-tick + compact cluster numbers log -->
    <div class="mx-cluster-bar" id="mxClusterSection">
      <div class="row">
        <input id="clusterInput" class="field-input" placeholder="Cluster IDs, e.g. 65 48 32 47 2 1" autocomplete="off">
        <button id="clusterApply" class="btn primary small" type="button" style="padding:6px 14px;font-size:13px">Tick</button>
        <span class="sub" id="clusterStatus"></span>
      </div>
      <div class="mx-left" id="mxLeft"></div>
      <div class="mx-log" id="mxLog"></div>
    </div>

    <div class="mx-bar">
      <div class="row" id="mxSheets"></div>
      <div class="row" id="mxControls">
        <input id="mxSearch" class="search" type="search" placeholder="Filter Track ID, class, symbol…" style="min-width:200px">
        <div class="row" id="mxFilterPills"></div>
      </div>
    </div>

    <div class="mx-wrap" id="mxWrap"></div>
  </div>
  <div class="dlg-foot">
    <div class="row">
      <button class="btn" id="mxDownloadBtn" type="button">Download .xlsx</button>
      <button class="btn" id="mxUpdateBtn" type="button">Update .xlsx</button>
    </div>
    <span class="sub" id="mxFootInfo"></span>
  </div>
</dialog>

<!-- New job dialog -->
<dialog id="newDlg" aria-labelledby="newTitle">
  <div class="dlg-head">
    <div>
      <h2 id="newTitle">New job</h2>
      <div class="sub">Choose the qc_report.xlsx first. Tracks, frames and cuboids are read from it.</div>
    </div>
    <button type="button" class="btn small" data-close>Close</button>
  </div>
  <div class="dlg-body">
    <label class="field">QC file (.xlsx)
      <input type="file" id="newFile" accept=".xlsx">
    </label>
    <div class="sub" id="newPreview"></div>
    <div class="grid4">
      <label class="field">Batch <input id="newBatch" type="text"></label>
      <label class="field">Task <input id="newTask" type="text"></label>
      <label class="field">Job <input id="newJob" type="text"></label>
      <label class="field">QC <select id="newQc"></select></label>
    </div>
  </div>
  <div class="dlg-foot">
    <span class="sub">Assigned time is recorded when you create the job.</span>
    <button class="btn primary" id="createJob" type="button" disabled>Create job</button>
  </div>
</dialog>

<!-- Report dialog -->
<dialog id="reportDlg" aria-labelledby="reportTitle">
  <div class="dlg-head">
    <div>
      <h2 id="reportTitle">Report</h2>
      <div class="sub">Copy and paste this into Zalo, Messenger or email.</div>
    </div>
    <button type="button" class="btn small" data-close>Close</button>
  </div>
  <div class="dlg-body">
    <textarea id="reportText" readonly></textarea>
  </div>
  <div class="dlg-foot">
    <span class="sub" id="reportCount"></span>
    <button type="button" class="btn primary" id="copyReport">Copy</button>
  </div>
</dialog>

<!-- Notion-style floating link popover + Excel row menu -->
<div id="linkPopover" class="popover" hidden></div>
<div id="excelMenu" class="popover" hidden></div>

<!-- JSZip reads and writes the .xlsx file in the browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* =========================================================
   CONFIG — edit these to match your project
   ========================================================= */

const CONFIG = {
  title: 'My jobs',
  reportName: 'Dũng',   // name written in the report header
  openLabel: 'Open',    // text of the link in the "Open link" column
};

const STAGES = [
  { id:'todo',        label:'Not started',      color:'#4B5563', tint:'#EEF1F5' },
  { id:'in_progress', label:'Anno in progress', color:'#2F5BEA', tint:'#E8EEFD' },
  { id:'anno_done',   label:'Anno complete',    color:'#0E7C86', tint:'#E0F3F4' },
  { id:'qc_progress', label:'QC in progress',   color:'#B45309', tint:'#FDF0DC' },
  { id:'qc_done',     label:'QC complete',      color:'#1E7F4F', tint:'#E2F4EA' },
];

const QC_STATUS = [
  { id:'',            label:'–' },
  { id:'qc_progress', label:'QC in progress' },
  { id:'qc_done',     label:'QC complete' },
];

const QC_REVIEWERS = ['Huyền', 'Chi', 'Huy', 'Long'];

const COLUMNS = [
  { key:'no',          label:'No.',             type:'text',     visible:true },
  { key:'batch',       label:'Batch',           type:'text',     visible:true },
  { key:'task',        label:'Task',            type:'text',     visible:true },
  { key:'job',         label:'Job',             type:'text',     visible:true },
  { key:'qc',          label:'QC',              type:'qc',       visible:true },
  { key:'frames',      label:'Frame',           type:'auto',     visible:true },
  { key:'trackCount',  label:'TrackID',         type:'auto',     visible:true },
  { key:'cuboidTotal', label:'Cuboid',          type:'auto',     visible:true },
  { key:'progress',    label:'Annotating',      type:'progress', visible:true },
  { key:'issues',      label:'Open issues',     type:'issues',   visible:true },
  { key:'stage',       label:'Stage',           type:'stage',    visible:true },
  { key:'qcState',     label:'QC status',       type:'qcstatus', visible:true },
  { key:'assignedAt',  label:'Ngày giao',       type:'assigned', visible:true },
  { key:'completedAt', label:'Ngày hoàn thành', type:'completed',visible:true },
  { key:'link',        label:'Open link',       type:'link',     visible:true },
];

/* =========================================================
   INDEXEDDB STORE FOR .XLSX FILES
   ========================================================= */

const excelStore = (() => {
  const DB_NAME = 'jobReportFiles.v1';
  const STORE = 'files';
  let dbPromise = null;

  function openDb(){
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject(new Error('No IndexedDB')); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }

  async function run(mode, fn){
    try {
      const db = await openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, mode);
        const req = fn(tx.objectStore(STORE));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (err) {
      console.warn('Excel storage error:', err);
      return null;
    }
  }

  return {
    put: (key, file) => run('readwrite', s => s.put(file, key)),
    get: (key) => run('readonly', s => s.get(key)),
    del: (key) => run('readwrite', s => s.delete(key)),
  };
})();

function positionPopover(pop, anchor){

  const ph = pop.offsetHeight;
  let top = rect.bottom + 6;
  if (top + ph > window.innerHeight - 10) {
    top = Math.max(8, rect.top - ph - 6);
  }
  let left = rect.left;
  if (left + pw > window.innerWidth - 10) {
    left = Math.max(8, window.innerWidth - pw - 10);
  }
  pop.style.top = `${Math.round(top)}px`;
  pop.style.left = `${Math.round(left)}px`;
}

function colToNum(col){
  let n = 0;
  for (let i = 0; i < col.length; i++) n = n * 26 + (col.charCodeAt(i) - 64);
  return n;
}

function numToCol(n){
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

/* =========================================================
   READING & WRITING THE QC FILE (.xlsx)
   ========================================================= */

const OFFICE_THEME = [
  '#FFFFFF','#000000','#E7E6E6','#44546A','#4472C4',
  '#ED7D31','#A5A5A5','#FFC000','#5B9BD5','#70AD47',
];

function applyTint(hex, tint){
  if (!hex || !tint) return hex;
  const t = Number(tint);
  if (Number.isNaN(t) || t === 0) return hex;
  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const out = ch.map(v => {
    const nv = t > 0 ? v + (255 - v) * t : v * (1 + t);
    return Math.max(0, Math.min(255, Math.round(nv))).toString(16).padStart(2, '0');
  });
  return '#' + out.join('');
}

function resolveExcelColor(el){
  if (!el) return null;
  const rgb = el.getAttribute('rgb');
  if (rgb) {
    const clean = rgb.trim().replace(/^#/, '');
    if (clean.length === 8) return '#' + clean.slice(2);
    if (clean.length === 6) return '#' + clean;
  }
  const theme = el.getAttribute('theme');
  if (theme !== null) {
    const base = OFFICE_THEME[Number(theme)];
    if (base) return applyTint(base, el.getAttribute('tint'));
  }
  return null;
}

function readableInk(bgHex){
  if (!bgHex || bgHex.length !== 7) return '#16202B';
  const r = parseInt(bgHex.slice(1, 3), 16);
  const g = parseInt(bgHex.slice(3, 5), 16);
  const b = parseInt(bgHex.slice(5, 7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum < 0.52 ? '#FFFFFF' : '#16202B';
}

function loadXml(zip, path){
  const f = zip.file(path);
  if (!f) throw new Error(`Missing ${path} in this file.`);
  return f.async('string').then(text => new DOMParser().parseFromString(text, 'application/xml'));
}

async function readSharedStrings(zip){
  const f = zip.file('xl/sharedStrings.xml');
  if (!f) return [];
  const doc = new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  return [...doc.getElementsByTagName('si')].map(si =>
    [...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
}

async function readStyles(zip){
  const sf = zip.file('xl/styles.xml');
  if (!sf) return { fills: [], fonts: [], xfs: [] };
  const doc = new DOMParser().parseFromString(await sf.async('string'), 'application/xml');

  const fillsEl = doc.getElementsByTagName('fills')[0];
  const fills = fillsEl ? [...fillsEl.getElementsByTagName('fill')].map(f => {
    const p = f.getElementsByTagName('patternFill')[0];
    const solid = !!p && p.getAttribute('patternType') === 'solid';
    const fg = p ? p.getElementsByTagName('fgColor')[0] : null;
    return { solid, bg: solid ? resolveExcelColor(fg) : null };
  }) : [];

  const fontsEl = doc.getElementsByTagName('fonts')[0];
  const fonts = fontsEl ? [...fontsEl.getElementsByTagName('font')].map(f => {
    const col = f.getElementsByTagName('color')[0];
    return { color: resolveExcelColor(col), bold: f.getElementsByTagName('b').length > 0 };
  }) : [];

  const xfsEl = doc.getElementsByTagName('cellXfs')[0];
  const xfs = xfsEl ? [...xfsEl.getElementsByTagName('xf')].map(x => ({
    fillId: Number(x.getAttribute('fillId') || 0),
    fontId: Number(x.getAttribute('fontId') || 0),
  })) : [];

  return { fills, fonts, xfs };
}

function readCellValue(c, sst){
  const t = c.getAttribute('t');
  if (t === 'inlineStr') {
    const text = [...c.getElementsByTagName('t')].map(x => x.textContent).join('').trim();
    return text || null;
  }
  const vEl = c.getElementsByTagName('v')[0];
  if (!vEl || vEl.textContent === '') return null;
  if (t === 's')   return (sst[Number(vEl.textContent)] || '').trim() || null;
  if (t === 'str') return vEl.textContent.trim();
  if (t === 'b' || t === 'e') return vEl.textContent;
  const n = Number(vEl.textContent);
  return Number.isNaN(n) ? vEl.textContent : n;
}

async function readWorkbookContext(zip){
  const [wb, rels, sst, styles] = await Promise.all([
    loadXml(zip, 'xl/workbook.xml'),
    loadXml(zip, 'xl/_rels/workbook.xml.rels'),
    readSharedStrings(zip),
    readStyles(zip),
  ]);
  const relMap = new Map([...rels.getElementsByTagName('Relationship')].map(r => [
    r.getAttribute('Id'),
    r.getAttribute('Target'),
  ]));
  const sheetList = [...wb.getElementsByTagName('sheet')].map(s => {
    const target = relMap.get(s.getAttribute('r:id')) || '';
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    return { name: s.getAttribute('name'), path };
  }).filter(s => s.path);
  return { sheetList, sst, styles };
}

async function readSheetFromContext(zip, ctx, sheetName){
  const info = ctx.sheetList.find(s => s.name === sheetName);
  if (!info) return null;
  const sheet = await loadXml(zip, info.path);
  const rows = new Map();

  for (const c of sheet.getElementsByTagName('c')) {
    const m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute('r') || '');
    if (!m) continue;
    const col = m[1];
    const row = Number(m[2]);
    const s = Number(c.getAttribute('s') || 0);
    const xf = ctx.styles.xfs[s];
    const fill = xf ? ctx.styles.fills[xf.fillId] : null;
    const font = xf ? ctx.styles.fonts[xf.fontId] : null;
    const filled = !!(fill && fill.solid);
    const bg = filled ? (fill.bg || '#DCE8FF') : null;
    const fg = font && font.color ? font.color : (bg ? readableInk(bg) : null);

    if (!rows.has(row)) rows.set(row, new Map());
    rows.get(row).set(col, {
      v: readCellValue(c, ctx.sst),
      filled,
      bg,
      fg,
      bold: !!(font && font.bold),
    });
  }
  return rows;
}

// Find the "v" tick column right after the last frame column without clobbering other headers
function findTickCol(headerColsMap, maxFrameColNum){
  const candidates = [...headerColsMap.entries()]
    .map(([col, cell]) => ({ col, num: colToNum(col), val: cell.v }))
    .filter(x => x.num > maxFrameColNum)
    .sort((a, b) => a.num - b.num);

  // Reuse an explicit v / done / tick column if present
  const existing = candidates.find(x =>
    typeof x.val === 'string' && /^(v|✓|done|tick)$/i.test(x.val.trim())
  );
  if (existing) return { col: existing.col, num: existing.num, hasHeader: true };

  // Otherwise pick the first column after the last frame with an empty header
  let n = maxFrameColNum + 1;
  while (true) {
    const col = numToCol(n);
    const cell = headerColsMap.get(col);
    const empty = !cell || cell.v === null || String(cell.v).trim() === '';
    if (empty) return { col, num: n, hasHeader: false };
    n++;
  }
}

async function parseQcFile(file){
  if (typeof JSZip === 'undefined') {
    throw new Error('The file reader did not load. Check your internet connection and reload.');
  }
  const zip = await JSZip.loadAsync(file);
  const ctx = await readWorkbookContext(zip);

  const matrix = await readSheetFromContext(zip, ctx, 'Matrix');
  if (!matrix) throw new Error('This file has no "Matrix" sheet.');

  let headerRow = null;
  for (const [row, cols] of matrix) {
    const a = cols.get('A') && cols.get('A').v;
    if (typeof a === 'string' && a.trim().toLowerCase() === 'track id') { headerRow = row; break; }
  }
  if (headerRow === null) throw new Error('Could not find the "Track ID" header row in Matrix.');

  const headerCols = matrix.get(headerRow);
  const frameCols = [];
  for (const [col, cell] of headerCols) {
    if (typeof cell.v === 'number' && Number.isInteger(cell.v)) frameCols.push([col, cell.v]);
  }
  if (!frameCols.length) throw new Error('No frame numbers found in the header row.');

  const frameNums = frameCols.map(f => f[1]);
  const frames = Math.max(...frameNums) - Math.min(...frameNums) + 1;
  const maxFrameColNum = Math.max(...frameCols.map(([col]) => colToNum(col)));
  const tickCol = findTickCol(headerCols, maxFrameColNum);

  const tracks = [];
  const rowNumbers = [...matrix.keys()].filter(r => r > headerRow).sort((a, b) => a - b);
  for (const row of rowNumbers) {
    const cols = matrix.get(row);
    const idCell = cols.get('A');
    if (!idCell || typeof idCell.v !== 'number' || !Number.isInteger(idCell.v)) continue;

    const clsCell = cols.get('B');
    const present = frameCols
      .filter(([col]) => {
        const c = cols.get(col);
        return c && (c.filled || c.v !== null);
      })
      .map(([, f]) => f)
      .sort((a, b) => a - b);

    const vCell = cols.get(tickCol.col);
    const isTicked = !!(vCell && typeof vCell.v === 'string' && /^(v|✓)$/i.test(vCell.v.trim()));

    const first = present.length ? present[0] : null;
    const last  = present.length ? present[present.length - 1] : null;
    tracks.push({
      id: idCell.v,
      cls: clsCell && clsCell.v ? String(clsCell.v) : '',
      first,
      last,
      cuboids: present.length ? last - first + 1 : 0,
      done: isTicked,
    });
  }

  let batchHint = '', taskHint = '';
  const summary = await readSheetFromContext(zip, ctx, 'Summary');
  const pathCell = summary && summary.get(3) && summary.get(3).get('B');
  const path = pathCell && typeof pathCell.v === 'string' ? pathCell.v : '';
  const bm = /batch[_\s-]*(\d+)/i.exec(path);
  const tm = /[\\/](\d{3,6})[\\/]annotations/i.exec(path);
  if (bm) batchHint = bm[1];
  if (tm) taskHint = tm[1];

  return { frames, tracks, source: file.name, batchHint, taskHint };
}

// Write/clear "v" ticks directly inside the Matrix worksheet XML
function setInlineCell(doc, ns, rowEl, rowNum, colLetter, colNum, text){
  const ref = colLetter + rowNum;
  const cells = [...rowEl.children].filter(el => el.localName === 'c');
  let cEl = cells.find(el => el.getAttribute('r') === ref) || null;

  if (!text) {
    if (!cEl) return;
    cEl.removeAttribute('t');
    while (cEl.firstChild) cEl.removeChild(cEl.firstChild);
    if (!cEl.getAttribute('s')) rowEl.removeChild(cEl);
    return;
  }

  if (!cEl) {
    cEl = doc.createElementNS(ns, 'c');
    cEl.setAttribute('r', ref);
    const after = cells.find(el => {
      const m = /^([A-Z]+)\d+$/.exec(el.getAttribute('r') || '');
      return m && colToNum(m[1]) > colNum;
    });
    if (after) rowEl.insertBefore(cEl, after);
    else rowEl.appendChild(cEl);
  } else {
    while (cEl.firstChild) cEl.removeChild(cEl.firstChild);
  }

  cEl.setAttribute('t', 'inlineStr');
  const isEl = doc.createElementNS(ns, 'is');
  const tEl = doc.createElementNS(ns, 't');
  tEl.textContent = text;
  isEl.appendChild(tEl);
  cEl.appendChild(isEl);

  // Keep row spans attribute valid if present
  const spans = rowEl.getAttribute('spans');
  const sm = /^(\d+):(\d+)$/.exec(spans || '');
  if (sm && Number(sm[2]) < colNum) {
    rowEl.setAttribute('spans', `${sm[1]}:${colNum}`);
  }
}

async function syncTicksIntoWorkbook(file, r){
  if (typeof JSZip === 'undefined') return file;
  const zip = await JSZip.loadAsync(file);
  const ctx = await readWorkbookContext(zip);
  const matInfo = ctx.sheetList.find(s => s.name === 'Matrix');
  if (!matInfo) return file;

  const sheetDoc = await loadXml(zip, matInfo.path);
  const ns = sheetDoc.documentElement.namespaceURI || 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const rowEls = [...sheetDoc.getElementsByTagName('row')];

  // Locate header row ("Track ID" in col A)
  let headerRowEl = null;
  let headerRowNum = null;
  const headerColsMap = new Map();

  for (const rowEl of rowEls) {
    const rn = Number(rowEl.getAttribute('r') || 0);
    const cells = [...rowEl.children].filter(el => el.localName === 'c');
    const aCell = cells.find(el => el.getAttribute('r') === 'A' + rn);
    const aVal = aCell ? readCellValue(aCell, ctx.sst) : null;
    if (typeof aVal === 'string' && aVal.trim().toLowerCase() === 'track id') {
      headerRowEl = rowEl;
      headerRowNum = rn;
      for (const c of cells) {
        const m = /^([A-Z]+)\d+$/.exec(c.getAttribute('r') || '');
        if (m) headerColsMap.set(m[1], { v: readCellValue(c, ctx.sst) });
      }
      break;
    }
  }
  if (!headerRowEl) return file;

  const frameColNums = [...headerColsMap.entries()]
    .filter(([, cell]) => typeof cell.v === 'number' && Number.isInteger(cell.v))
    .map(([col]) => colToNum(col));
  if (!frameColNums.length) return file;

  const maxFrameColNum = Math.max(...frameColNums);
  const tickCol = findTickCol(headerColsMap, maxFrameColNum);
  const doneById = new Map((r.tracks || []).map(t => [t.id, !!t.done]));

  // Write "v" header only if the tick column header was blank
  if (!tickCol.hasHeader) {
    setInlineCell(sheetDoc, ns, headerRowEl, headerRowNum, tickCol.col, tickCol.num, 'v');
  }

  // Sync each track row's "v" cell
  for (const rowEl of rowEls) {
    const rn = Number(rowEl.getAttribute('r') || 0);
    if (rn <= headerRowNum) continue;
    const cells = [...rowEl.children].filter(el => el.localName === 'c');
    const aCell = cells.find(el => el.getAttribute('r') === 'A' + rn);
    const idVal = aCell ? readCellValue(aCell, ctx.sst) : null;
    if (typeof idVal !== 'number' || !Number.isInteger(idVal)) continue;
    if (!doneById.has(idVal)) continue;

    setInlineCell(sheetDoc, ns, rowEl, rn, tickCol.col, tickCol.num, doneById.get(idVal) ? 'v' : '');
  }

  // Expand <dimension ref="..."/> if tickCol extends past the original used range
  const dimEl = sheetDoc.getElementsByTagName('dimension')[0];
  if (dimEl) {
    const dm = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(dimEl.getAttribute('ref') || '');
    if (dm && tickCol.num > colToNum(dm[3])) {
      dimEl.setAttribute('ref', `${dm[1]}${dm[2]}:${tickCol.col}${dm[4]}`);
    }
  }

  let xmlOut = new XMLSerializer().serializeToString(sheetDoc);
  if (!/^\s*<\?xml\b/.test(xmlOut)) {
    xmlOut = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + xmlOut;
  }
  zip.file(matInfo.path, xmlOut);

  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    compression: 'DEFLATE',
  });
}

function mergeImport(r, parsed, fileKey){
  const old = new Map((r.tracks || []).map(t => [t.id, t]));
  r.tracks = parsed.tracks.map(t => ({
    ...t,
    done: !!(t.done || (old.get(t.id) && old.get(t.id).done)),
  }));
  r.frames = parsed.frames;
  r.source = { name: parsed.source, importedAt: nowLocal(), fileKey: fileKey || null };
  refreshAnno(r);
}

async function downloadJobExcel(r){
  if (!r || !r.source || !r.source.fileKey) {
    alert('The original .xlsx file is not stored in this browser yet. Click "Update .xlsx" to attach it.');
    return;
  }
  const file = await excelStore.get(r.source.fileKey);
  if (!file) {
    alert('Stored .xlsx file was not found in this browser. Click "Update .xlsx" to re-attach it.');
    return;
  }
  let outBlob = file;
  try {
    outBlob = await syncTicksIntoWorkbook(file, r);
  } catch (err) {
    console.warn('Could not patch v ticks into workbook, exporting original file:', err);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(outBlob);
  a.download = r.source.name || `job-${r.job || r.no}.xlsx`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function triggerExcelUpdate(rowNo){
  attachTargetRowNo = rowNo;
  closeExcelMenu();
  $('#attachFile').click();
}

   UNIFIED EXCEL MATRIX & TRACK TICKING MODAL
   ========================================================= */

const matrixDlg = $('#matrixDlg');

function setStatus(msg){
  $('#clusterStatus').textContent = msg;
}

async function openMatrixPreview(rowNo){
  const r = rowByNo(rowNo);
  if (!r) return;
  closeLinkPopover();
  closeExcelMenu();

  mx.rowNo = rowNo;
  mx.sheets = [];
  mx.activeSheet = '';
  mx.fromFile = false;
  mx.query = '';
  mx.filter = 'all';
  $('#mxSearch').value = '';
  $('#clusterInput').value = '';
  setStatus('');

  $('#mxTitle').textContent = `Matrix · Job ${r.job || r.no}`;
  $('#mxSub').textContent = 'Loading…';
  $('#mxBanner').hidden = true;
  $('#mxWrap').innerHTML = `<div class="muted" style="padding:24px;text-align:center">Reading workbook…</div>`;
  if (!matrixDlg.open) matrixDlg.showModal();

  const storedFile = r.source && r.source.fileKey ? await excelStore.get(r.source.fileKey) : null;
  if (storedFile && typeof JSZip !== 'undefined') {
    try {
      const zip = await JSZip.loadAsync(storedFile);
      const ctx = await readWorkbookContext(zip);
      for (const s of ctx.sheetList) {
        const rows = await readSheetFromContext(zip, ctx, s.name);
        if (rows) mx.sheets.push({ name: s.name, rows });
      }
      mx.fromFile = true;
      const mat = mx.sheets.find(s => s.name === 'Matrix');
      mx.activeSheet = mat ? 'Matrix' : (mx.sheets[0] ? mx.sheets[0].name : '');
    } catch (err) {
      console.warn('Could not parse stored Excel for preview:', err);
    }
  }

  if (!mx.sheets.length && r.tracks && r.tracks.length) {
    mx.sheets = [{ name: 'Matrix', rows: null, fallback: true }];
    mx.activeSheet = 'Matrix';
    mx.fromFile = false;
  }

  renderMatrixModal(false);
}

function isMatrixSheet(sheet){
  if (!sheet) return false;
  if (sheet.fallback) return true;
  if (!sheet.rows) return false;
  for (const [, cols] of sheet.rows) {
    const a = cols.get('A') && cols.get('A').v;
    if (typeof a === 'string' && a.trim().toLowerCase() === 'track id') return true;
  }
  return false;
}

function renderMatrixModal(preserveScroll = true){
  const r = rowByNo(mx.rowNo);
  if (!r) return;

  const wrap = $('#mxWrap');
  const prevTop = preserveScroll ? wrap.scrollTop : 0;
  const prevLeft = preserveScroll ? wrap.scrollLeft : 0;

  const n = trackCount(r);
  const d = doneCount(r);
  const hasStoredFile = !!(r.source && r.source.fileKey);

  $('#mxDownloadBtn').disabled = !hasStoredFile;
  $('#mxDownloadBtn').title = hasStoredFile
    ? `Download ${r.source.name} with synced v ticks`
    : 'Attach/update the .xlsx file once in this browser to enable download';

  $('#mxTitle').textContent = `Matrix · Job ${r.job || r.no}`;
  $('#mxSub').textContent = `${r.source ? r.source.name : 'No file attached'} · ` +
    `Done ${d} / ${n} · Left ${n - d} · ${r.frames} frames · ${cuboidsOf(r)} cuboids`;

  const banner = $('#mxBanner');
  if (!mx.fromFile && mx.sheets.length) {
    banner.hidden = false;
    banner.innerHTML =
      `<span>Showing saved track spans (attach the <b>.xlsx</b> once in this browser to see original Excel colors, symbols, and export synced v ticks).</span>` +
      `<button type="button" class="btn small" id="mxBannerAttach">Attach .xlsx</button>`;
  } else {
    banner.hidden = true;
    banner.innerHTML = '';
  }

  const sheet = mx.sheets.find(s => s.name === mx.activeSheet);
  const matrixMode = isMatrixSheet(sheet);
  $('#mxClusterSection').style.display = (matrixMode && n > 0) ? 'flex' : 'none';

  if (n > 0) {
    const leftText = d === n
      ? 'All tracks done ✓'
      : 'Left: ' + r.tracks.filter(t => !t.done).map(t => t.id).join(', ');
    $('#mxLeft').textContent = leftText;
    $('#mxLeft').title = leftText;

    const clusters = r.clusters || [];
    $('#mxLog').innerHTML = clusters.map(c =>
      `<span class="mx-log-tag">${c.ids.join(' ')}` +
      `<button type="button" class="mx-log-del" data-cluster-del="${esc(c.id)}" title="Remove cluster">×</button></span>`
    ).join('');
  }

  $('#mxSheets').innerHTML = mx.sheets.map(s =>
    `<button type="button" class="pill small${s.name === mx.activeSheet ? ' on' : ''}" data-mx-sheet="${esc(s.name)}">${esc(s.name)}</button>`
  ).join('');

  $('#mxControls').style.display = matrixMode ? 'flex' : 'none';

  if (!sheet) {
    wrap.innerHTML = `<div class="muted" style="padding:32px;text-align:center">No QC file attached to this job yet. Click “Update .xlsx” below to attach one.</div>`;
    $('#mxFootInfo').textContent = '';
    return;
  }

  if (matrixMode) {
    renderMatrixGrid(r, sheet);
  } else {
    renderGenericSheet(sheet);
  }

  if (preserveScroll) {
    wrap.scrollTop = prevTop;
    wrap.scrollLeft = prevLeft;
  }
}

function renderMatrixGrid(r, sheet){
  const byId = new Map((r.tracks || []).map(t => [t.id, t]));
  const q = mx.query.trim().toLowerCase();

  let frameList = [];
  let dataRows = [];

  if (sheet.fallback) {
    const maxF = Math.max(0, (r.frames || 0) - 1, ...r.tracks.map(t => t.last ?? 0));
    const minF = Math.min(0, ...r.tracks.map(t => t.first ?? 0));
    for (let f = minF; f <= maxF; f++) frameList.push({ col: String(f), label: f });

    dataRows = r.tracks.map(t => {
      const cells = frameList.map(fc => {
        const present = t.first !== null && t.last !== null && fc.label >= t.first && fc.label <= t.last;
        return { filled: present, bg: null, fg: null, bold: false, v: null };
      });
      return { id: t.id, cls: t.cls, track: t, cells, hasSymbol: false };
    });
  } else {
    let headerRow = null;
    for (const [rowNum, cols] of sheet.rows) {
      const a = cols.get('A') && cols.get('A').v;
      if (typeof a === 'string' && a.trim().toLowerCase() === 'track id') { headerRow = rowNum; break; }
    }
    const headerCols = sheet.rows.get(headerRow);
    frameList = [...headerCols.entries()]
      .filter(([, cell]) => typeof cell.v === 'number' && Number.isInteger(cell.v))
      .sort((a, b) => colToNum(a[0]) - colToNum(b[0]))
      .map(([col, cell]) => ({ col, label: cell.v }));

    const rowNums = [...sheet.rows.keys()].filter(n => n > headerRow).sort((a, b) => a - b);
    for (const rn of rowNums) {
      const cols = sheet.rows.get(rn);
      const idCell = cols.get('A');
      if (!idCell || typeof idCell.v !== 'number' || !Number.isInteger(idCell.v)) continue;
      const clsCell = cols.get('B');
      const cls = clsCell && clsCell.v !== null ? String(clsCell.v) : '';
      let hasSymbol = false;
      const cells = frameList.map(fc => {
        const c = cols.get(fc.col);
        if (!c) return { filled: false, bg: null, fg: null, bold: false, v: null };
        if (c.v !== null && String(c.v).trim() !== '') hasSymbol = true;
        return c;
      });
      dataRows.push({ id: idCell.v, cls, track: byId.get(idCell.v) || null, cells, hasSymbol });
    }
  }

  const totalCount = dataRows.length;
  const undoneCount = dataRows.filter(dr => !dr.track || !dr.track.done).length;
  const symbolCount = dataRows.filter(dr => dr.hasSymbol).length;

  $('#mxFilterPills').innerHTML = [
    ['all', 'All', totalCount],
    ['undone', 'Undone', undoneCount],
    ['symbols', 'With symbols', symbolCount],
  ].map(([id, label, count]) =>
    `<button type="button" class="pill small${mx.filter === id ? ' on' : ''}" data-mx-filter="${id}">${label} <b>${count}</b></button>`
  ).join('');

  const filtered = dataRows.filter(dr => {
    if (mx.filter === 'undone' && dr.track && dr.track.done) return false;
    if (mx.filter === 'symbols' && !dr.hasSymbol) return false;
    if (q) {
      const syms = dr.cells.map(c => c.v ?? '').join(' ');
      const hay = `${dr.id} ${dr.cls} ${syms}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const headHtml =
    `<tr>` +
    `<th class="sticky-0">Track</th>` +
    `<th class="sticky-1">Class</th>` +
    frameList.map(f => `<th>${esc(f.label)}</th>`).join('') +
    `<th class="sticky-v" title="Click anywhere on a row to toggle v">v</th>` +
    `</tr>`;

  const bodyHtml = filtered.length
    ? filtered.map(dr => {
        const isDone = !!(dr.track && dr.track.done);
        const clickable = dr.track ? ` data-mx-row="${dr.id}"` : '';
        const rowClass = [dr.track ? 'mx-clickable' : '', isDone ? 'mx-done' : ''].filter(Boolean).join(' ');

        const frameTds = dr.cells.map((c, idx) => {
          const hasText = c.v !== null && String(c.v).trim() !== '';
          const classes = ['mx-cell'];
          const styles = [];
          if (c.bg) {
            styles.push(`background:${c.bg}`);
            if (c.fg) styles.push(`color:${c.fg}`);
          } else if (c.filled) {
            classes.push('mx-present');
          }
          if (c.bold) styles.push('font-weight:700');
          if (hasText) classes.push('mx-sym');

          const tip = `Track ${dr.id} · Frame ${frameList[idx].label}` + (hasText ? ` · ${c.v}` : '');
          return `<td class="${classes.join(' ')}"${styles.length ? ` style="${styles.join(';')}"` : ''} title="${esc(tip)}">${hasText ? esc(c.v) : ''}</td>`;
        }).join('');

        return `<tr class="${rowClass}"${clickable}>` +
          `<td class="mx-meta sticky-0">${dr.id}</td>` +
          `<td class="mx-meta sticky-1" title="${esc(dr.cls)}">${esc(dr.cls)}</td>` +
          frameTds +
          `<td class="mx-v sticky-v">${isDone ? 'v' : ''}</td>` +
          `</tr>`;
      }).join('')
    : `<tr><td colspan="${frameList.length + 3}" class="empty">No tracks match this filter.</td></tr>`;

  $('#mxWrap').innerHTML = `<table class="mx"><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table>`;
  $('#mxFootInfo').textContent = `Showing ${filtered.length} of ${totalCount} tracks · Click anywhere on a row to tick/untick v.`;
}

function renderGenericSheet(sheet){
  const rowNums = [...sheet.rows.keys()].sort((a, b) => a - b);
  const colSet = new Set();
  for (const rn of rowNums) {
    for (const col of sheet.rows.get(rn).keys()) colSet.add(col);
  }
  const cols = [...colSet].sort((a, b) => colToNum(a) - colToNum(b));

  if (!rowNums.length || !cols.length) {
    $('#mxWrap').innerHTML = `<div class="muted" style="padding:32px;text-align:center">This sheet is empty.</div>`;
    $('#mxFootInfo').textContent = '';
    return;
  }

  const headHtml = `<tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
  const bodyHtml = rowNums.map(rn => {
    const map = sheet.rows.get(rn);
    const tds = cols.map(col => {
      const c = map.get(col);
      if (!c) return `<td></td>`;
      const styles = [];
      if (c.bg) styles.push(`background:${c.bg}`);
      if (c.fg) styles.push(`color:${c.fg}`);
      if (c.bold) styles.push('font-weight:600');
      const txt = c.v ?? '';
      return `<td${styles.length ? ` style="${styles.join(';')}"` : ''} title="${esc(txt)}">${esc(txt)}</td>`;
    }).join('');
    return `<tr><td class="muted">${rn}</td>${tds}</tr>`;
  }).join('');

  $('#mxWrap').innerHTML = `<table class="mx mx-generic"><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table>`;
  $('#mxFootInfo').textContent = `Sheet "${sheet.name}" · ${rowNums.length} rows × ${cols.length} columns`;
}

function applyCluster(){
  const r = rowByNo(mx.rowNo);
  if (!r) return;
  if (!r.tracks.length) { setStatus('Attach the QC file first.'); return; }

  const input = $('#clusterInput');
  const nums = [...new Set(input.value.split(/[\s,;]+/).filter(t => /^\d+$/.test(t)).map(Number))];
  if (!nums.length) { setStatus('Type track IDs separated by spaces, e.g. 65 48 32 47 2 1'); return; }

  const byId = new Map(r.tracks.map(t => [t.id, t]));
  const found = [], missing = [];
  let newly = 0;

  nums.forEach(n => {
    const t = byId.get(n);
    if (!t) { missing.push(n); return; }
    found.push(n);
    if (!t.done) { t.done = true; newly++; }
  });

  if (found.length) {
    r.clusters = r.clusters || [];
    r.clusters.push({
      id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
      ids: found,
      at: nowLocal(),
    });
  }
  refreshAnno(r);
  input.value = '';

  let msg = `Ticked ${newly}`;
  if (found.length > newly) msg += `, ${found.length - newly} already done`;
  if (missing.length) msg += ` · Not in file: ${missing.join(', ')}`;
  setStatus(msg);

  render();
  renderMatrixModal(true);
}

function deleteCluster(cid){
  const r = rowByNo(mx.rowNo);
  if (!r) return;
  const entry = (r.clusters || []).find(c => c.id === cid);
  if (!entry) return;
  if (!confirm(`Remove cluster "${entry.ids.join(' ')}"? Those IDs will be unticked unless another cluster has them.`)) return;

  const others = new Set((r.clusters || []).filter(c => c.id !== cid).flatMap(c => c.ids));
  const byId = new Map(r.tracks.map(t => [t.id, t]));
  entry.ids.forEach(id => {
    if (!others.has(id) && byId.has(id)) byId.get(id).done = false;
  });
  r.clusters = r.clusters.filter(c => c.id !== cid);
  refreshAnno(r);
  render();
  renderMatrixModal(true);
}

matrixDlg.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { matrixDlg.close(); return; }
  if (e.target.closest('#mxBannerAttach')) { triggerExcelUpdate(mx.rowNo); return; }

  const del = e.target.closest('[data-cluster-del]');
  if (del) { deleteCluster(del.dataset.clusterDel); return; }

  const tab = e.target.closest('[data-mx-sheet]');
  if (tab) {
    mx.activeSheet = tab.dataset.mxSheet;
    renderMatrixModal(false);
    return;
  }

  const flt = e.target.closest('[data-mx-filter]');
  if (flt) {
    mx.filter = flt.dataset.mxFilter;
    renderMatrixModal(false);
    return;
  }

  // Click anywhere on a track row to toggle v
  const rowEl = e.target.closest('tr[data-mx-row]');
  if (rowEl) {
    const r = rowByNo(mx.rowNo);
    if (!r) return;
    const t = r.tracks.find(x => x.id === Number(rowEl.dataset.mxRow));
    if (!t) return;
    t.done = !t.done;
    refreshAnno(r);
    render();
    renderMatrixModal(true);
  }
});

matrixDlg.addEventListener('close', () => {
  mx.rowNo = null;
  mx.sheets = [];
  render();
});

$('#clusterApply').addEventListener('click', applyCluster);
$('#clusterInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); applyCluster(); }
});
$('#mxSearch').addEventListener('input', e => {
  mx.query = e.target.value;
  renderMatrixModal(false);
});
$('#mxDownloadBtn').addEventListener('click', () => downloadJobExcel(rowByNo(mx.rowNo)));
$('#mxUpdateBtn').addEventListener('click', () => triggerExcelUpdate(mx.rowNo));

  if (lpMode !== 'preview') return;
  lpHideTimer = setTimeout(() => {
    if (lpMode === 'preview') closeLinkPopover();
  }, 180);

linkPop.addEventListener('mouseenter', cancelLinkHide);
linkPop.addEventListener('mouseleave', scheduleLinkHide);

linkPop.addEventListener('click', async e => {
  const copyBtn = e.target.closest('[data-lp-copy]');
  if (copyBtn) {
    const r = rowByNo(lpRowNo);
    if (!r || !r.link) return;
    try { await navigator.clipboard.writeText(r.link); } catch (_) {}
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = ICON_CHECK;
    setTimeout(() => {
      if (copyBtn.isConnected) {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = ICON_COPY;
      }
    }, 1200);
    return;
  }

  if (e.target.closest('[data-lp-edit]')) {
    openLinkEdit(lpRowNo, lpAnchor);
    return;
  }

  if (e.target.closest('[data-lp-clear]')) {
    const r = rowByNo(lpRowNo);
    if (r) { r.link = ''; render(); }
    closeLinkPopover();
  }
});

linkPop.addEventListener('submit', e => {
  if (e.target.id !== 'lpForm') return;
  e.preventDefault();
  const r = rowByNo(lpRowNo);
  const input = $('#lpInput');
  if (r && input) {
    r.link = normalizeUrl(input.value);
    render();
  }
  closeLinkPopover();
});

/* =========================================================
   EXCEL ROW POPOVER MENU
   ========================================================= */

const excelMenu = $('#excelMenu');
let xmRowNo = null;

function closeExcelMenu(){
  excelMenu.hidden = true;
  excelMenu.innerHTML = '';
  xmRowNo = null;
}

function openExcelMenu(rowNo, anchor){
  if (xmRowNo === rowNo && !excelMenu.hidden) { closeExcelMenu(); return; }
  const r = rowByNo(rowNo);
  if (!r) return;
  closeLinkPopover();
  xmRowNo = rowNo;

  const hasFile = !!(r.source && r.source.fileKey);
  const hasPreview = hasFile || trackCount(r) > 0;
  const nameText = r.source ? r.source.name : 'No QC file attached';

  excelMenu.innerHTML = `
    <div class="xm">
      <div class="xm-head" title="${esc(nameText)}">${esc(nameText)}</div>
      <button type="button" class="xm-btn" data-xm-preview ${hasPreview ? '' : 'disabled'}>
        <span>Preview Matrix</span>
      </button>
      <button type="button" class="xm-btn" data-xm-open ${hasFile ? '' : 'disabled'}
        title="${hasFile ? 'Download .xlsx with synced v ticks' : 'Attach the .xlsx file once in this browser to enable download'}">
        <span>Download .xlsx</span>
      </button>
      <button type="button" class="xm-btn" data-xm-update>
        <span>${r.source ? 'Update .xlsx (keeps ticks)' : 'Attach .xlsx'}</span>
      </button>
    </div>`;
  positionPopover(excelMenu, anchor);
}

excelMenu.addEventListener('click', e => {
  const r = rowByNo(xmRowNo);
  if (!r) return;
  if (e.target.closest('[data-xm-preview]')) {
    openMatrixPreview(r.no);
  } else if (e.target.closest('[data-xm-open]')) {
    closeExcelMenu();
    downloadJobExcel(r);
  } else if (e.target.closest('[data-xm-update]')) {
    triggerExcelUpdate(r.no);
  }
});

/* =========================================================
   RENDER
   ========================================================= */

function pill({active, attrs, label, count, small}){
  return `<button type="button" class="pill${small ? ' small' : ''}${active ? ' on' : ''}" ${attrs}>` +
         `${esc(label)}${count !== undefined ? ` <b>${count}</b>` : ''}</button>`;
}

function renderPills(){
  $('#statePills').innerHTML =
    pill({ active: ui.states.size === 0, attrs:'data-action="clear-states"', label:'All', count: DATA.length }) +
    STAGES.map(s => pill({
      active: ui.states.has(s.id),
      attrs:`data-toggle="states" data-value="${esc(s.id)}"`,
      label: s.label,
      count: DATA.filter(r => stageOf(r) === s.id).length,
    })).join('');

  const qcOptions = [...QC_REVIEWERS, '__none__'];
  $('#qcPills').innerHTML =
    pill({ active: ui.qcs.size === 0, attrs:'data-action="clear-qcs"', label:'All', count: DATA.length }) +
    qcOptions.map(n => {
      const isNone = n === '__none__';
      return pill({
        active: ui.qcs.has(n),
        attrs:`data-toggle="qcs" data-value="${esc(n)}"`,
        label: isNone ? 'Unassigned' : n,
        count: DATA.filter(r => isNone ? !r.qc : r.qc === n).length,
      });
    }).join('');

  $('#colPills').innerHTML =
    pill({ active: false, small:true, attrs:'data-action="cols-all"', label:'Show all' }) +
    pill({ active: false, small:true, attrs:'data-action="cols-none"', label:'Hide all' }) +
    COLUMNS.map(c => pill({
      active: ui.cols.has(c.key),
      small: true,
      attrs:`data-toggle="cols" data-value="${esc(c.key)}"`,
      label: c.label,
    })).join('');
}

function renderSummary(){
  const tracksAll  = DATA.reduce((a, r) => a + trackCount(r), 0);
  const tracksDone = DATA.reduce((a, r) => a + doneCount(r), 0);
  const cuboidsAll = DATA.reduce((a, r) => a + cuboidsOf(r), 0);
  const issues     = DATA.reduce((a, r) => a + openCount(r), 0);
  const qcDone     = DATA.filter(r => stageOf(r) === 'qc_done').length;
  const pct        = tracksAll ? Math.round(tracksDone / tracksAll * 100) : 0;

  const stats = [
    [fmt(DATA.length), 'Jobs'],
    [pct + '%', `Tracks done (${fmt(tracksDone)} / ${fmt(tracksAll)})`],
    [fmt(qcDone) + ' / ' + fmt(DATA.length), 'QC complete'],
    [fmt(issues), 'Open issues'],
    [fmt(cuboidsAll), 'Cuboids'],
  ];
  $('#summary').innerHTML = stats.map(([n, l]) =>
    `<div class="card stat"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join('');
}

function cell(col, r){
  const id = `data-id="${r.no}"`;
  const aria = `aria-label="${esc(col.label)}"`;

  switch (col.type) {
    case 'text':
      if (col.key === 'no') return fmt(r.no);
      return `<input class="cell-text" type="text" data-edit="${col.key}" ${id} ${aria} value="${esc(r[col.key])}">`;

    case 'qc':
      return `<select class="inline" data-edit="qc" ${id} aria-label="QC reviewer">
        <option value="">–</option>
        ${QC_REVIEWERS.map(n => `<option${n === r.qc ? ' selected' : ''}>${esc(n)}</option>`).join('')}
      </select>`;

    case 'auto': {
      if (!r.source) return `<span class="muted">–</span>`;
      const v = col.key === 'frames' ? r.frames
              : col.key === 'trackCount' ? trackCount(r)
              : cuboidsOf(r);
      return `<span>${fmt(v)}</span>`;
    }

    case 'progress': {
      const pct = pctOf(r);
      return `<button type="button" class="issue-btn" data-tracks="${r.no}" title="Open Matrix & tick tracks">` +
               `${fmt(doneCount(r))} / ${fmt(trackCount(r))}</button>` +
             `<span class="bar${pct >= 100 ? ' done' : ''}"><i style="width:${pct.toFixed(1)}%"></i></span>` +
             `<span class="pct">${pct.toFixed(0)}%</span>`;
    }

    case 'issues': {
      const open = openCount(r);
      return `<button type="button" class="issue-btn${open > 0 ? ' bad' : ''}" data-notes="${r.no}"
        title="Open notes for this job">${fmt(open)}</button>`;
    }

    case 'stage': {
      const s = stageMeta(stageOf(r));
      return `<span class="badge" style="color:${s.color};background:${s.tint}">${esc(s.label)}</span>`;
    }

    case 'qcstatus':
      return `<select class="inline" data-edit="qcState" ${id} aria-label="QC status">
        ${QC_STATUS.map(o => `<option value="${o.id}"${o.id === (r.qcState || '') ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select>`;

    case 'assigned':
      return r.assignedAt
        ? `<span class="ts">${fmtDate(r.assignedAt)}</span>`
        : `<span class="ts none">–</span>`;

    case 'completed':
      return r.annoDoneAt
        ? `<span class="ts">${fmtDate(r.annoDoneAt)}</span>`
        : `<span class="ts none">–</span>`;

    case 'link':
      return r.link
        ? `<a class="open" href="${esc(safeUrl(r.link))}" target="_blank" rel="noopener" data-link-row="${r.no}">${esc(CONFIG.openLabel)}</a>`
        : `<button type="button" class="addlink" data-link-add="${r.no}">Add link</button>`;

    default:
      return esc(r[col.key] ?? '–');
  }
}

function renderTable(){
  const cols = COLUMNS.filter(c => ui.cols.has(c.key));
  const rows = DATA.filter(matches);

  if (!cols.length) {
    $('#head').innerHTML = '';
    $('#body').innerHTML = `<tr><td class="empty">No columns selected. Click a column above to show it.</td></tr>`;
  } else {
    $('#head').innerHTML = cols.map(c =>
      `<th class="${isNumeric(c) ? 'num' : ''}">${esc(c.label)}</th>`).join('') + '<th></th>';

    const body = rows.map(r =>
      `<tr>${cols.map(c => `<td class="${isNumeric(c) ? 'num' : ''}">${cell(c, r)}</td>`).join('')}` +
      `<td><div class="row-actions">` +
      `<button type="button" class="btn small" data-excel-menu="${r.no}" title="Preview, download, or update QC Excel file">Excel</button>` +
      `<button type="button" class="btn danger small" data-delete="${r.no}">Delete</button>` +
      `</div></td></tr>`
    ).join('');

    $('#body').innerHTML = rows.length ? body
      : `<tr><td colspan="${cols.length + 1}" class="empty">${
          DATA.length ? 'No jobs match these filters.' : 'No jobs yet. Click “+ Add job” to start.'}</td></tr>`;
  }

  $('#count').textContent = `Showing ${rows.length} of ${DATA.length} jobs · ${cols.length} columns`;
}

function render(){
  $('#title').textContent = `${CONFIG.title} (${DATA.length})`;
  renderSummary();
  renderPills();
  renderTable();
  saveData();
}

/* ----- Notes dialog ----- */

function renderNotes(){
  const r = currentRow();
  if (!r) return;
  const notes = r.notes || [];
  $('#dlgTitle').textContent = `Notes · Job ${r.job || r.no}`;
  $('#dlgSub').textContent = `${openCount(r)} open · ${notes.length} total`;
  $('#dlgBody').innerHTML = notes.length
    ? notes.map(n => `
        <div class="note${n.done ? ' done' : ''}">
          <textarea data-note="${n.id}" data-field="text" rows="2"
            placeholder="Describe the issue: frame, track ID, object, what to fix…">${esc(n.text)}</textarea>
          <div class="note-meta">
            <label><input type="checkbox" data-note="${n.id}" data-field="done" ${n.done ? 'checked' : ''}> Resolved</label>
            <span class="at">${esc(n.at)}</span>
            <button type="button" class="btn danger small" data-note-del="${n.id}">Delete</button>
          </div>
        </div>`).join('')
    : `<div class="muted">No notes yet. Click “+ Add note” to write one.</div>`;
}

function openNotes(no){
  closeLinkPopover();
  closeExcelMenu();
  openRowNo = no;
  renderNotes();
  $('#notesDlg').showModal();
}

function addNote(){
  const r = currentRow();
  if (!r) return;
  r.notes = r.notes || [];
  r.notes.push({
    id: ++noteSeq,
    text: '',
    done: false,
    at: new Date().toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }),
  });
  renderNotes();
  const boxes = $('#dlgBody').querySelectorAll('textarea');
  if (boxes.length) boxes[boxes.length - 1].focus();
  render();
}

/* ----- Report ----- */

function reportLine(r){
  const n = trackCount(r);
  const d = doneCount(r);
  const annoText = isAnnoComplete(r) ? 'Anno xong' : `Anno ${pctOf(r).toFixed(0)}% (${d}/${n})`;
  const qcText = {
    qc_done: 'QC xong',
    qc_progress: 'QC đang làm',
    anno_done: 'chờ QC',
  }[stageOf(r)] || '';

  const parts = [
    `Task ${r.task || '–'} - Job ${r.job || '–'}`,
    `TrackID ${n}`,
    `Cuboid ${cuboidsOf(r)}`,
    annoText,
    qcText,
    `Giao: ${fmtDate(r.assignedAt) || '–'}`,
    `Hoàn thành: ${fmtDate(r.annoDoneAt) || '–'}`,
  ].filter(Boolean);

  return '- ' + parts.join(' | ');
}

function buildReport(){
  if (!DATA.length) return '';

  const groups = new Map();
  DATA.forEach(r => {
    const key = String(r.batch ?? '').trim() || '–';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const batches = [...groups.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const blocks = batches.map(b =>
    [`Batch ${b} - ${CONFIG.reportName}`, ...groups.get(b).map(reportLine)].join('\n'));

  const tracks  = DATA.reduce((a, r) => a + trackCount(r), 0);
  const cuboids = DATA.reduce((a, r) => a + cuboidsOf(r), 0);
  const totals = `Tổng: ${DATA.length} job · TrackID ${tracks} · Cuboid ${cuboids}`;

  return blocks.join('\n\n') + '\n\n' + totals;
}

function openReport(){
  closeLinkPopover();
  closeExcelMenu();
  $('#reportText').value = buildReport() || 'No jobs yet.';
  $('#reportCount').textContent = `${DATA.length} jobs`;
  $('#reportDlg').showModal();
}

async function copyReport(){
  const box = $('#reportText');
  const btn = $('#copyReport');
  try {
    await navigator.clipboard.writeText(box.value);
  } catch (err) {
    box.select();
    document.execCommand('copy');
  }
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
}

/* =========================================================
   DATA ACTIONS
   ========================================================= */

function setQcStatus(row, value){
  row.qcState = value;
}

function openNewJob(){
  closeLinkPopover();
  closeExcelMenu();
  pendingImport = null;
  $('#newFile').value = '';
  $('#newBatch').value = '';
  $('#newTask').value = '';
  $('#newJob').value = '';
  $('#newQc').value = '';
  $('#newPreview').textContent = 'Choose the file to read tracks, frames and cuboids.';
  $('#createJob').disabled = true;
  $('#newDlg').showModal();
}

async function createJob(){
  if (!pendingImport) return;
  const no = DATA.reduce((m, r) => Math.max(m, r.no), 0) + 1;
  const fileKey = makeFileKey();
  if (pendingImport.file) {
    await excelStore.put(fileKey, pendingImport.file);
  }

  const row = {
    no,
    batch: $('#newBatch').value.trim(),
    task: $('#newTask').value.trim(),
    job: $('#newJob').value.trim(),
    qc: $('#newQc').value || null,
    qcState: '',
    source: { name: pendingImport.source, importedAt: nowLocal(), fileKey: pendingImport.file ? fileKey : null },
    frames: pendingImport.frames,
    tracks: pendingImport.tracks.map(t => ({ ...t })),
    clusters: [],
    notes: [],
    link: '',
    assignedAt: nowLocal(),
    annoDoneAt: '',
  };
  refreshAnno(row);
  DATA.push(row);
  pendingImport = null;

  ui.states.clear();
  ui.qcs.clear();
  ui.query = '';
  $('#q').value = '';

  $('#newDlg').close();
  render();
}

function deleteJob(no){
  const i = DATA.findIndex(r => r.no === no);
  if (i === -1) return;
  const label = DATA[i].job || `No. ${no}`;
  if (!confirm(`Delete job ${label}?`)) return;
  const oldKey = DATA[i].source && DATA[i].source.fileKey;
  if (oldKey) excelStore.del(oldKey);
  DATA.splice(i, 1);
  closeLinkPopover();
  closeExcelMenu();
  render();
}

function backupData(){
  const payload = { version: 2, exportedAt: new Date().toISOString(), data: DATA };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  a.download = `job-report-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* =========================================================
   EVENTS
   ========================================================= */

document.addEventListener('click', e => {
  if (!linkPop.hidden && !e.target.closest('#linkPopover, [data-link-add], [data-link-row]')) {
    closeLinkPopover();
  }
  if (!excelMenu.hidden && !e.target.closest('#excelMenu, [data-excel-menu]')) {
    closeExcelMenu();
  }

  const addLinkBtn = e.target.closest('[data-link-add]');
  if (addLinkBtn) {
    openLinkEdit(Number(addLinkBtn.dataset.linkAdd), addLinkBtn);
    return;
  }

  const excelBtn = e.target.closest('[data-excel-menu]');
  if (excelBtn) {
    openExcelMenu(Number(excelBtn.dataset.excelMenu), excelBtn);
    return;
  }

  const b = e.target.closest('[data-action],[data-toggle],[data-delete],[data-notes],[data-tracks]');
  if (!b) return;

  if (b.dataset.tracks !== undefined) { openMatrixPreview(Number(b.dataset.tracks)); return; }
  if (b.dataset.notes !== undefined)  { openNotes(Number(b.dataset.notes)); return; }
  if (b.dataset.delete !== undefined) { deleteJob(Number(b.dataset.delete)); return; }
  if (b.dataset.action === 'add-job') { openNewJob(); return; }

  if (b.dataset.toggle) {
    const set = ui[b.dataset.toggle];
    const v = b.dataset.value;
    if (set.has(v)) set.delete(v); else set.add(v);
  }

  switch (b.dataset.action) {
    case 'clear-states': ui.states.clear(); break;
    case 'clear-qcs':    ui.qcs.clear(); break;
    case 'cols-all':     ui.cols = new Set(COLUMNS.map(c => c.key)); break;
    case 'cols-none':    ui.cols.clear(); break;
  }
  render();
});

$('#body').addEventListener('mouseover', e => {
  const linkEl = e.target.closest('a[data-link-row]');
  if (!linkEl || lpMode === 'edit') return;
  openLinkPreview(Number(linkEl.dataset.linkRow), linkEl);
});

$('#body').addEventListener('mouseout', e => {
  const linkEl = e.target.closest('a[data-link-row]');
  if (!linkEl) return;
  if (e.relatedTarget && (linkEl.contains(e.relatedTarget) || linkPop.contains(e.relatedTarget))) return;
  scheduleLinkHide();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeLinkPopover();
    closeExcelMenu();
  }
});

window.addEventListener('scroll', () => { closeLinkPopover(); closeExcelMenu(); }, true);
window.addEventListener('resize', () => { closeLinkPopover(); closeExcelMenu(); });

document.addEventListener('change', e => {
  const el = e.target.closest('[data-edit]');
  if (!el) return;
  const row = DATA.find(r => r.no === Number(el.dataset.id));
  if (!row) return;

  const field = el.dataset.edit;
  const value = el.value;

  if (field === 'qcState') setQcStatus(row, value);
  else if (field === 'qc') row.qc = value || null;
  else                     row[field] = value.trim();

  render();
});

$('#attachFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  const r = rowByNo(attachTargetRowNo);
  attachTargetRowNo = null;
  if (!file || !r) return;
  try {
    const parsed = await parseQcFile(file);
    const oldKey = r.source && r.source.fileKey;
    const newKey = makeFileKey();
    await excelStore.put(newKey, file);
    if (oldKey) excelStore.del(oldKey);

    mergeImport(r, parsed, newKey);
    render();
    if (matrixDlg.open && mx.rowNo === r.no) {
      openMatrixPreview(r.no);
    }
  } catch (err) {
    alert('Could not read this file: ' + err.message);
  }
});

// Notes dialog
const dlg = $('#notesDlg');

dlg.addEventListener('change', e => {
  const el = e.target.closest('[data-note]');
  const r = currentRow();
  if (!el || !r) return;
  const note = (r.notes || []).find(n => String(n.id) === el.dataset.note);
  if (!note) return;

  if (el.dataset.field === 'done') note.done = el.checked;
  else note.text = el.value.trim();

  renderNotes();
  render();
});

dlg.addEventListener('click', e => {
  const r = currentRow();
  if (e.target.closest('[data-close]')) { dlg.close(); return; }
  const del = e.target.closest('[data-note-del]');
  if (del && r) {
    r.notes = r.notes.filter(n => String(n.id) !== del.dataset.noteDel);
    renderNotes();
    render();
  }
});

$('#addNote').addEventListener('click', addNote);
dlg.addEventListener('close', () => { openRowNo = null; render(); });

// New job dialog
const newDlg = $('#newDlg');
$('#newQc').innerHTML = `<option value="">–</option>` +
  QC_REVIEWERS.map(n => `<option>${esc(n)}</option>`).join('');

$('#newFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('#newPreview').textContent = 'Reading file…';
  $('#createJob').disabled = true;
  try {
    const parsed = await parseQcFile(file);
    pendingImport = { ...parsed, file };
    const cuboids = parsed.tracks.reduce((a, t) => a + t.cuboids, 0);
    const ticked = parsed.tracks.filter(t => t.done).length;
    $('#newPreview').textContent =
      `${parsed.tracks.length} tracks · ${parsed.frames} frames · ${cuboids} cuboids` +
      (ticked ? ` · ${ticked} already ticked` : '');
    if (!$('#newBatch').value && parsed.batchHint) $('#newBatch').value = parsed.batchHint;
    if (!$('#newTask').value && parsed.taskHint) $('#newTask').value = parsed.taskHint;
    $('#createJob').disabled = false;
  } catch (err) {
    pendingImport = null;
    $('#newPreview').textContent = 'Could not read this file: ' + err.message;
  }
});

$('#createJob').addEventListener('click', createJob);
newDlg.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) newDlg.close();
});

// Report dialog
const reportDlg = $('#reportDlg');
$('#report').addEventListener('click', openReport);
$('#copyReport').addEventListener('click', copyReport);
reportDlg.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) reportDlg.close();
});

$('#q').addEventListener('input', e => { ui.query = e.target.value; renderTable(); });

// Backup and restore
$('#backup').addEventListener('click', backupData);
$('#restore').addEventListener('click', () => $('#restoreFile').click());

$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const rows = Array.isArray(parsed) ? parsed : parsed.data;
    if (!Array.isArray(rows)) throw new Error('No job list found in this file.');
    if (!confirm(`Replace the current ${DATA.length} jobs with ${rows.length} jobs from the backup?`)) return;
    DATA = migrate(rows);
    syncNoteSeq();
    render();
  } catch (err) {
    alert('Could not restore: ' + err.message);
  }
});

render();
</script>
