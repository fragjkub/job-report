<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4F7; --surface:#FFFFFF; --ink:#16202B; --muted:#657386;
    --line:#DCE2EA; --hover:#F7F9FC; --head:#FAFBFC;
    --accent:#2F5BEA; --accent-tint:#EEF3FE; --ok:#1E9E5A; --bad:#D6403A; --danger:#B42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .stat{padding:12px 14px}
  .stat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:12px}

  .toolbar{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
  .label{color:var(--muted);font-size:12px;width:56px;flex:none}

  .pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
  .pill b{font-weight:600;font-variant-numeric:tabular-nums}
  .pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
  .pill.small{font-size:12px;padding:3px 9px}

  .search{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-width:220px;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger);border-color:#F3C4C0}
  .btn.small{padding:4px 9px;font-size:12px}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:500;background:var(--head);position:sticky;top:0}
  tbody tr:hover td{background:var(--hover)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  td.empty{text-align:center;color:var(--muted);padding:32px}

  input.cell-text,input.cell-num,input.link-in{
    border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;font:inherit;color:var(--ink);
  }
  input.cell-text{width:110px}
  input.cell-num{width:76px;text-align:right;font-variant-numeric:tabular-nums}
  input.link-in{width:170px;border-color:var(--line);background:#fff}
  input.cell-text:hover,input.cell-num:hover{border-color:var(--line)}
  input.cell-text:focus,input.cell-num:focus,input.link-in:focus{background:#fff;border-color:var(--accent);outline:none}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  .prog{display:inline-flex;align-items:center;gap:4px}
  .prog .sep{color:var(--muted)}
  .bar{display:inline-block;width:110px;height:6px;background:#E8ECF1;border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar.done i{background:var(--ok)}
  .pct{display:inline-block;min-width:44px;margin-left:8px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

  .issue-btn{background:none;border:0;padding:2px 6px;font:inherit;color:var(--ink);cursor:pointer;border-radius:4px;text-decoration:underline dotted var(--muted);text-underline-offset:3px;font-variant-numeric:tabular-nums}
  .issue-btn:hover{background:var(--hover)}
  .issue-btn.bad{color:var(--bad);font-weight:600}

  select.state{border:0;border-radius:6px;padding:5px 10px;font:inherit;font-weight:500;cursor:pointer}
  select.inline{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;background:#fff;cursor:pointer}
  a.open{color:var(--accent);text-decoration:none}
  a.open:hover{text-decoration:underline}

  dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(580px,92vw);color:var(--ink);box-shadow:0 20px 50px rgba(16,24,40,.2)}
  dialog::backdrop{background:rgba(16,24,40,.35)}
  .dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .dlg-head h2{font-size:16px;font-weight:600;margin:0}
  #dlgBody{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto}
  .note{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
  .note.done{opacity:.6}
  .note textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;resize:vertical;min-height:52px}
  .note-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
  .note-meta .at{margin-right:auto}
  .dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .muted{color:var(--muted)}

  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="count"></div>
    </div>
    <div class="row">
      <input id="q" class="search" type="search" placeholder="Search batch, task, job, QC…">
      <button type="button" class="btn primary" data-action="add-job">+ Add job</button>
      <button id="export" class="btn" type="button">Export CSV</button>
      <button id="backup" class="btn" type="button">Backup</button>
      <button id="restore" class="btn" type="button">Restore</button>
      <input id="restoreFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <section class="card">
    <div class="toolbar">
      <div class="row"><span class="label">State</span><div class="row" id="statePills"></div></div>
      <div class="row"><span class="label">QC</span><div class="row" id="qcPills"></div></div>
      <div class="row"><span class="label">Columns</span><div class="row" id="colPills"></div></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>

</div>

<dialog id="notesDlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div>
      <h2 id="dlgTitle"></h2>
      <div class="sub" id="dlgSub"></div>
    </div>
    <button type="button" class="btn small" data-close>Close</button>
  </div>
  <div id="dlgBody"></div>
  <div class="dlg-foot">
    <span class="sub">Unresolved notes are counted as open issues.</span>
    <button type="button" class="btn primary" id="addNote">+ Add note</button>
  </div>
</dialog>

<script>
/* =========================================================
   CONFIG — edit these to match your project
   ========================================================= */

const CONFIG = {
  title: 'My jobs',
  openUrl: 'https://your-tool.example/jobs/{job}', // {job} is replaced with the job id
  openLabel: 'Open',
};

// Status pipeline. Order = order of pills.
const STATES = [
  { id:'todo',        label:'To do',          color:'#4B5563', tint:'#EEF1F5' },
  { id:'in_progress', label:'In progress',    color:'#2F5BEA', tint:'#E8EEFD' },
  { id:'anno_done',   label:'Anno complete',  color:'#0E7C86', tint:'#E0F3F4' },
  { id:'qc_progress', label:'QC in progress', color:'#B45309', tint:'#FDF0DC' },
  { id:'qc_done',     label:'QC complete',    color:'#1E7F4F', tint:'#E2F4EA' },
];

// QC reviewers shown as filters and in the QC dropdown.
const QC_REVIEWERS = ['Huyền', 'Chi', 'Huy', 'Long'];

// Columns. "visible" = shown when the page first loads.
// The Columns pills let you turn any of them on or off.
const COLUMNS = [
  { key:'no',       label:'No.',         type:'text',     visible:true },
  { key:'batch',    label:'Batch',       type:'text',     visible:true },
  { key:'task',     label:'Task',        type:'text',     visible:true },
  { key:'job',      label:'Job',         type:'text',     visible:true },
  { key:'qc',       label:'QC',          type:'qc',       visible:true },
  { key:'frame',    label:'Frame',       type:'num',      visible:true },
  { key:'trackId',  label:'TrackID',     type:'num',      visible:true },
  { key:'cuboid',   label:'Cuboid',      type:'num',      visible:true },
  { key:'progress', label:'Annotating',  type:'progress', visible:true },
  { key:'issues',   label:'Open issues', type:'issues',   visible:true },
  { key:'state',    label:'State',       type:'state',    visible:true },
  { key:'link',     label:'Attach link', type:'link',     visible:true },
  { key:'open',     label:'Open link',   type:'open',     visible:true },
];

/* =========================================================
   DATA + SAVING
   The page saves every change to this browser automatically
   (localStorage), so jobs stay after you reload or come back
   tomorrow. Use Backup / Restore to keep a copy or move to
   another computer.
   ========================================================= */

const STORAGE_KEY = 'jobReport.v1';

// Used only the first time, when nothing is saved yet.
const SEED = [
  { no:1, batch:3, task:2772, job:3269, qc:'Huy', frame:30, trackId:55,  cuboid:1100, annotated:55,  total:55,  state:'anno_done', link:'', notes:[] },
  { no:2, batch:3, task:2901, job:3398, qc:'Huy', frame:30, trackId:115, cuboid:3000, annotated:115, total:115, state:'anno_done', link:'', notes:[] },
];

function loadData(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (err) {
    console.warn('Could not read saved data:', err);
  }
  return JSON.parse(JSON.stringify(SEED));
}

function saveData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  } catch (err) {
    console.warn('Could not save data:', err);
  }
}

let DATA = loadData();

/* =========================================================
   STATE
   Filters are multi-select: click to turn on, click again to turn off.
   Empty filter = no restriction. Empty columns = empty table.
   ========================================================= */

const ui = {
  states: new Set(),
  qcs: new Set(),
  cols: new Set(COLUMNS.filter(c => c.visible).map(c => c.key)),
  query: '',
};

let openRowNo = null;   // job whose notes dialog is open
let noteSeq = 0;        // id counter for notes

function syncNoteSeq(){
  noteSeq = DATA.reduce((m, r) =>
    Math.max(m, ...(r.notes || []).map(n => Number(n.id) || 0)), 0);
}
syncNoteSeq();

/* =========================================================
   HELPERS
   ========================================================= */

const $ = sel => document.querySelector(sel);
const fmt = n => Number(n ?? 0).toLocaleString('en-US');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stateOf = id => STATES.find(s => s.id === id) || STATES[0];
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const isNumeric = c => ['num', 'progress', 'issues'].includes(c.type);
const NUM_FIELDS = ['frame', 'trackId', 'cuboid', 'annotated', 'total'];

const pctOf = r => r.total ? Math.min(100, r.annotated / r.total * 100) : 0;
const openCount = r => (r.notes || []).filter(n => !n.done).length;
const currentRow = () => DATA.find(r => r.no === openRowNo);

function matches(r){
  if (ui.states.size && !ui.states.has(r.state)) return false;
  if (ui.qcs.size && !ui.qcs.has(r.qc || '__none__')) return false;
  if (ui.query) {
    const hay = [r.batch, r.task, r.job, r.qc, r.link].join(' ').toLowerCase();
    if (!hay.includes(ui.query.toLowerCase())) return false;
  }
  return true;
}

/* =========================================================
   RENDER
   ========================================================= */

function pill({active, attrs, label, count, small}){
  return `<button type="button" class="pill${small ? ' small' : ''}${active ? ' on' : ''}" ${attrs}>` +
         `${esc(label)}${count !== undefined ? ` <b>${count}</b>` : ''}</button>`;
}

function renderPills(){
  $('#statePills').innerHTML =
    pill({ active: ui.states.size === 0, attrs:'data-action="clear-states"', label:'All', count: DATA.length }) +
    STATES.map(s => pill({
      active: ui.states.has(s.id),
      attrs:`data-toggle="states" data-value="${esc(s.id)}"`,
      label: s.label,
      count: DATA.filter(r => r.state === s.id).length,
    })).join('');

  const qcOptions = [...QC_REVIEWERS, '__none__'];
  $('#qcPills').innerHTML =
    pill({ active: ui.qcs.size === 0, attrs:'data-action="clear-qcs"', label:'All', count: DATA.length }) +
    qcOptions.map(n => {
      const isNone = n === '__none__';
      return pill({
        active: ui.qcs.has(n),
        attrs:`data-toggle="qcs" data-value="${esc(n)}"`,
        label: isNone ? 'Unassigned' : n,
        count: DATA.filter(r => isNone ? !r.qc : r.qc === n).length,
      });
    }).join('');

  $('#colPills').innerHTML =
    pill({ active: false, small:true, attrs:'data-action="cols-all"', label:'Show all' }) +
    pill({ active: false, small:true, attrs:'data-action="cols-none"', label:'Hide all' }) +
    COLUMNS.map(c => pill({
      active: ui.cols.has(c.key),
      small: true,
      attrs:`data-toggle="cols" data-value="${esc(c.key)}"`,
      label: c.label || 'Open link',
    })).join('');
}

function renderSummary(){
  const total  = DATA.reduce((a, r) => a + Number(r.total || 0), 0);
  const done   = DATA.reduce((a, r) => a + Number(r.annotated || 0), 0);
  const issues = DATA.reduce((a, r) => a + openCount(r), 0);
  const qcDone = DATA.filter(r => r.state === 'qc_done').length;
  const pct    = total ? Math.round(done / total * 100) : 0;

  const stats = [
    [fmt(DATA.length), 'Jobs'],
    [pct + '%', `Annotated (${fmt(done)} / ${fmt(total)})`],
    [fmt(qcDone) + ' / ' + fmt(DATA.length), 'QC complete'],
    [fmt(issues), 'Open issues'],
  ];
  $('#summary').innerHTML = stats.map(([n, l]) =>
    `<div class="card stat"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join('');
}

function cell(col, r){
  const id = `data-id="${r.no}"`;
  const aria = `aria-label="${esc(col.label)}"`;

  switch (col.type) {
    case 'text':
      if (col.key === 'no') return fmt(r.no);
      return `<input class="cell-text" type="text" data-edit="${col.key}" ${id} ${aria} value="${esc(r[col.key])}">`;

    case 'num':
      return `<input class="cell-num" type="number" min="0" data-edit="${col.key}" ${id} ${aria} value="${esc(r[col.key])}">`;

    case 'qc':
      return `<select class="inline" data-edit="qc" ${id} aria-label="QC reviewer">
        <option value="">–</option>
        ${QC_REVIEWERS.map(n => `<option${n === r.qc ? ' selected' : ''}>${esc(n)}</option>`).join('')}
      </select>`;

    case 'progress': {
      const pct = pctOf(r);
      return `<span class="prog">` +
               `<input class="cell-num" type="number" min="0" data-edit="annotated" ${id} aria-label="Annotated" value="${esc(r.annotated)}">` +
               `<span class="sep">/</span>` +
               `<input class="cell-num" type="number" min="0" data-edit="total" ${id} aria-label="Total" value="${esc(r.total)}">` +
             `</span>` +
             `<span class="bar${pct >= 100 ? ' done' : ''}"><i style="width:${pct.toFixed(1)}%"></i></span>` +
             `<span class="pct">${pct.toFixed(0)}%</span>`;
    }

    case 'issues': {
      const open = openCount(r);
      return `<button type="button" class="issue-btn${open > 0 ? ' bad' : ''}" data-notes="${r.no}"
        title="Open notes for this job">${fmt(open)}</button>`;
    }

    case 'state': {
      const s = stateOf(r.state);
      return `<select class="state" data-edit="state" ${id} aria-label="State"
        style="color:${s.color};background:${s.tint}">
        ${STATES.map(o => `<option value="${o.id}"${o.id === r.state ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select>`;
    }

    case 'link':
      return `<input class="link-in" type="url" data-edit="link" ${id} value="${esc(r.link)}" placeholder="Paste link" aria-label="Attach link">` +
        (r.link ? ` <a class="open" href="${esc(safeUrl(r.link))}" target="_blank" rel="noopener">↗</a>` : '');

    case 'open':
      return `<a class="open" href="${esc(CONFIG.openUrl.replace('{job}', encodeURIComponent(r.job)))}"
        target="_blank" rel="noopener">${esc(CONFIG.openLabel)} →</a>`;

    default:
      return esc(r[col.key] ?? '–');
  }
}

function renderTable(){
  const cols = COLUMNS.filter(c => ui.cols.has(c.key));
  const rows = DATA.filter(matches);

  if (!cols.length) {
    $('#head').innerHTML = '';
    $('#body').innerHTML = `<tr><td class="empty">No columns selected. Click a column above to show it.</td></tr>`;
  } else {
    $('#head').innerHTML = cols.map(c =>
      `<th class="${isNumeric(c) ? 'num' : ''}">${esc(c.label)}</th>`).join('') + '<th></th>';

    const body = rows.map(r =>
      `<tr>${cols.map(c => `<td class="${isNumeric(c) ? 'num' : ''}">${cell(c, r)}</td>`).join('')}` +
      `<td><button type="button" class="btn danger small" data-delete="${r.no}">Delete</button></td></tr>`
    ).join('');

    $('#body').innerHTML = rows.length ? body
      : `<tr><td colspan="${cols.length + 1}" class="empty">${
          DATA.length ? 'No jobs match these filters.' : 'No jobs yet. Click “+ Add job” to start.'}</td></tr>`;
  }

  $('#count').textContent = `Showing ${rows.length} of ${DATA.length} jobs · ${cols.length} columns`;
}

function render(){
  $('#title').textContent = `${CONFIG.title} (${DATA.length})`;
  renderSummary();
  renderPills();
  renderTable();
  saveData();
}

/* ----- Notes dialog ----- */

function renderNotes(){
  const r = currentRow();
  if (!r) return;
  const notes = r.notes || [];
  $('#dlgTitle').textContent = `Notes · Job ${r.job || r.no}`;
  $('#dlgSub').textContent = `${openCount(r)} open · ${notes.length} total`;
  $('#dlgBody').innerHTML = notes.length
    ? notes.map(n => `
        <div class="note${n.done ? ' done' : ''}">
          <textarea data-note="${n.id}" data-field="text" rows="2"
            placeholder="Describe the issue: frame, track ID, object, what to fix…">${esc(n.text)}</textarea>
          <div class="note-meta">
            <label><input type="checkbox" data-note="${n.id}" data-field="done" ${n.done ? 'checked' : ''}> Resolved</label>
            <span class="at">${esc(n.at)}</span>
            <button type="button" class="btn danger small" data-note-del="${n.id}">Delete</button>
          </div>
        </div>`).join('')
    : `<div class="muted">No notes yet. Click “+ Add note” to write one.</div>`;
}

function openNotes(no){
  openRowNo = no;
  renderNotes();
  $('#notesDlg').showModal();
}

function addNote(){
  const r = currentRow();
  if (!r) return;
  r.notes = r.notes || [];
  r.notes.push({
    id: ++noteSeq,
    text: '',
    done: false,
    at: new Date().toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }),
  });
  renderNotes();
  const boxes = $('#dlgBody').querySelectorAll('textarea');
  if (boxes.length) boxes[boxes.length - 1].focus();
  render();
}

/* =========================================================
   DATA ACTIONS
   ========================================================= */

function addJob(){
  const no = DATA.reduce((m, r) => Math.max(m, r.no), 0) + 1;
  DATA.push({
    no, batch:'', task:'', job:'', qc:null,
    frame:0, trackId:0, cuboid:0, annotated:0, total:0,
    state:'todo', link:'', notes:[],
  });

  // Clear filters and search so the new row is visible
  ui.states.clear();
  ui.qcs.clear();
  ui.query = '';
  $('#q').value = '';

  render();

  const first = document.querySelector(`[data-edit="batch"][data-id="${no}"]`) ||
                document.querySelector(`[data-edit][data-id="${no}"]`);
  if (first) first.focus();
}

function deleteJob(no){
  const i = DATA.findIndex(r => r.no === no);
  if (i === -1) return;
  const label = DATA[i].job || `No. ${no}`;
  if (!confirm(`Delete job ${label}?`)) return;
  DATA.splice(i, 1);
  render();
}

function backupData(){
  const payload = { version: 1, exportedAt: new Date().toISOString(), data: DATA };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  a.download = `job-report-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* =========================================================
   EVENTS
   ========================================================= */

// Table and page buttons: notes, delete, add, pill toggles, resets
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action],[data-toggle],[data-delete],[data-notes]');
  if (!b) return;

  if (b.dataset.notes !== undefined) { openNotes(Number(b.dataset.notes)); return; }
  if (b.dataset.delete !== undefined) { deleteJob(Number(b.dataset.delete)); return; }
  if (b.dataset.action === 'add-job') { addJob(); return; }

  if (b.dataset.toggle) {
    const set = ui[b.dataset.toggle];
    const v = b.dataset.value;
    if (set.has(v)) set.delete(v); else set.add(v);
  }

  switch (b.dataset.action) {
    case 'clear-states': ui.states.clear(); break;
    case 'clear-qcs':    ui.qcs.clear(); break;
    case 'cols-all':     ui.cols = new Set(COLUMNS.map(c => c.key)); break;
    case 'cols-none':    ui.cols.clear(); break;
  }
  render();
});

// Editing fields in the table
document.addEventListener('change', e => {
  const el = e.target.closest('[data-edit]');
  if (!el) return;
  const row = DATA.find(r => r.no === Number(el.dataset.id));
  if (!row) return;

  const field = el.dataset.edit;
  const value = el.value;

  if (field === 'qc')                  row.qc = value || null;
  else if (field === 'state')          row.state = value;
  else if (NUM_FIELDS.includes(field)) row[field] = Math.max(0, Number(value) || 0);
  else                                 row[field] = value.trim();

  render();
});

// Editing notes in the dialog
const dlg = $('#notesDlg');

dlg.addEventListener('change', e => {
  const el = e.target.closest('[data-note]');
  const r = currentRow();
  if (!el || !r) return;
  const note = (r.notes || []).find(n => String(n.id) === el.dataset.note);
  if (!note) return;

  if (el.dataset.field === 'done') note.done = el.checked;
  else note.text = el.value.trim();

  renderNotes();
  render();
});

dlg.addEventListener('click', e => {
  const r = currentRow();
  if (e.target.closest('[data-close]')) { dlg.close(); return; }
  const del = e.target.closest('[data-note-del]');
  if (del && r) {
    r.notes = r.notes.filter(n => String(n.id) !== del.dataset.noteDel);
    renderNotes();
    render();
  }
});

$('#addNote').addEventListener('click', addNote);

dlg.addEventListener('close', () => { openRowNo = null; render(); });

$('#q').addEventListener('input', e => { ui.query = e.target.value; renderTable(); });

// Backup and restore
$('#backup').addEventListener('click', backupData);
$('#restore').addEventListener('click', () => $('#restoreFile').click());

$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const rows = Array.isArray(parsed) ? parsed : parsed.data;
    if (!Array.isArray(rows)) throw new Error('No job list found in this file.');
    if (!confirm(`Replace the current ${DATA.length} jobs with ${rows.length} jobs from the backup?`)) return;
    DATA = rows;
    syncNoteSeq();
    render();
  } catch (err) {
    alert('Could not restore: ' + err.message);
  }
});

// CSV export of the current filtered view and visible columns
$('#export').addEventListener('click', () => {
  const cols = COLUMNS.filter(c => ui.cols.has(c.key) && c.type !== 'open');
  const rows = DATA.filter(matches);
  const lines = [cols.map(c => c.label)].concat(rows.map(r => cols.map(c => {
    if (c.type === 'progress') return `${r.annotated}/${r.total} (${pctOf(r).toFixed(0)}%)`;
    if (c.type === 'issues')   return openCount(r);
    if (c.type === 'state')    return stateOf(r.state).label;
    return r[c.key] ?? '';
  })));
  const csv = lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'job-report.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

render();
</script>
</body>
</html>
